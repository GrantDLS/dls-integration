name: Build and push DLS images

on:
  workflow_dispatch:

env:
  NODE_VERSION: 22.x
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/grantdls/dls-integration-backend
  FRONTEND_IMAGE: ghcr.io/grantdls/dls-integration-frontend

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out DLS integration repository
        uses: actions/checkout@v6

      - name: Initialise core submodule
        run: |
          git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: user-office-core/package-lock.json

      # The frontend SDK is generated by the core workspace before the
      # frontend image is built.
      - name: Install core workspace dependencies
        run: npm ci
        working-directory: user-office-core

      - name: Set frontend environment variables
        run: cp apps/frontend/example.development.env apps/frontend/.env
        working-directory: user-office-core

      - name: Generate frontend SDK
        run: npm run generate:sdk
        working-directory: user-office-core

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:manual

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./user-office-core
          file: ./user-office-core/apps/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:manual
